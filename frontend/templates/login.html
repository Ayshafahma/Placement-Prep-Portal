<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — PlacementPrep</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0a0e1a;
        --surface: #111827;
        --surface2: #1a2236;
        --border: #1e2d45;
        --accent: #3b82f6;
        --accent2: #06d6a0;
        --text: #e2e8f0;
        --muted: #64748b;
        --danger: #ef4444;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: "DM Sans", sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-image:
          radial-gradient(ellipse at 20% 50%, #1e3a5f22 0%, transparent 50%),
          radial-gradient(ellipse at 80% 50%, #06d6a011 0%, transparent 50%);
      }
      .auth-wrap {
        width: 100%;
        max-width: 420px;
        padding: 1.5rem;
      }
      .brand {
        text-align: center;
        margin-bottom: 2.5rem;
      }
      .brand h1 {
        font-family: "Syne", sans-serif;
        font-weight: 800;
        font-size: 2rem;
        color: var(--accent);
      }
      .brand h1 span {
        color: var(--accent2);
      }
      .brand p {
        color: var(--muted);
        font-size: 0.9rem;
        margin-top: 0.4rem;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 2rem;
      }
      .card h2 {
        font-family: "Syne", sans-serif;
        font-weight: 700;
        margin-bottom: 1.5rem;
      }
      .form-group {
        margin-bottom: 1.1rem;
      }
      label {
        display: block;
        font-size: 0.82rem;
        color: var(--muted);
        margin-bottom: 0.35rem;
      }
      input {
        width: 100%;
        background: var(--surface2);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 0.7rem 1rem;
        border-radius: 8px;
        font-size: 0.9rem;
        font-family: inherit;
        outline: none;
        transition: border 0.2s;
      }
      input:focus {
        border-color: var(--accent);
      }
      .btn {
        width: 100%;
        padding: 0.75rem;
        border-radius: 8px;
        border: none;
        background: var(--accent);
        color: #fff;
        font-size: 0.95rem;
        font-weight: 600;
        font-family: "Syne", sans-serif;
        cursor: pointer;
        transition: background 0.2s;
        margin-top: 0.5rem;
      }
      .btn:hover {
        background: #2563eb;
      }
      .auth-link {
        text-align: center;
        margin-top: 1.5rem;
        font-size: 0.87rem;
        color: var(--muted);
      }
      .auth-link a {
        color: var(--accent2);
        text-decoration: none;
      }
      .flash {
        padding: 0.7rem 1rem;
        border-radius: 8px;
        margin-bottom: 1rem;
        font-size: 0.85rem;
      }
      .flash.danger {
        background: #ef444422;
        border: 1px solid var(--danger);
        color: var(--danger);
      }
    </style>
  </head>
  <body>
    <div class="auth-wrap">
      <div class="brand">
        <h1>Placement<span>Prep</span></h1>
        <p>Track your placement journey</p>
      </div>
      <div class="card">
        <h2>Welcome back</h2>
        {% for cat, msg in get_flashed_messages(with_categories=true) %}
        <div class="flash {{ cat }}">{{ msg }}</div>
        {% endfor %}
        <form method="POST">
          <div class="form-group">
            <label>Email</label>
            <input
              type="email"
              name="email"
              placeholder="you@example.com"
              required
            />
          </div>
          <div class="form-group">
            <label>Password</label>
            <input
              type="password"
              name="password"
              placeholder="••••••••"
              required
            />
          </div>
          <button class="btn" type="submit">Login →</button>
        </form>
      </div>
      <div class="auth-link">
        Don't have an account?
        <a href="{{ url_for('register') }}">Register here</a>
      </div>
    </div>
  </body>
</html>
